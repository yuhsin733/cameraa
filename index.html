<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>100x 追星相機</title>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; overflow: hidden; }
        .view-container { width: 100vw; height: 70vh; position: relative; overflow: hidden; background: #111; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .crop-box {
            position: absolute; width: 120px; height: 120px;
            border: 2px dashed #00ff00; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
            pointer-events: none; box-sizing: border-box;
        }
        .controls { height: 30vh; padding: 15px; box-sizing: border-box; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        .zoom-val { font-size: 24px; font-weight: bold; color: #ffd700; }
        input[type=range] { width: 80%; height: 20px; }
        .snap-btn { padding: 12px 30px; background: #ff3b30; color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 30px; }
    </style>
</head>
<body>
    <div class="view-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="crop-box"></div>
    </div>
    <div class="controls">
        <div class="zoom-val" id="zoomText">框框對準目標：1.0x</div>
        <input type="range" id="zoomSlider" min="1" max="100" step="0.5" value="1">
        <button class="snap-btn" onclick="takePhoto()">📷 拍照並放大存檔</button>
    </div>
    <script>
        const video = document.getElementById('webcam');
        const zoomText = document.getElementById('zoomText');
        const zoomSlider = document.getElementById('zoomSlider');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("請允許相機存取： " + err));

        zoomSlider.oninput = function() {
            const val = parseFloat(this.value);
            zoomText.innerText = "框框對準目標：" + val.toFixed(1) + "x";
            video.style.transform = `scale(${val})`;
        };

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = 3000; canvas.height = 3000;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const link = document.createElement('a');
            link.download = '100x_photo.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
